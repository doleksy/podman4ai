# Run the unit tests (test/run.sh) on Linux. They need Bash and Node, never a
# real Podman. Not the Host-only checks in test/host/: see the README.
name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  # A new push to a PR replaces its old run; every push to main runs in full.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The runner's own shellcheck is older and reports things 0.11.0 doesn't.
      # Pin the version the README asks developers to match, so CI and local agree.
      - name: Install shellcheck 0.11.0
        env:
          VERSION: v0.11.0
          SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          tarball="shellcheck-$VERSION.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/$VERSION/$tarball"
          echo "$SHA256  $tarball" | sha256sum --check --strict
          tar -xJf "$tarball"
          mkdir -p "$HOME/.local/bin"
          mv "shellcheck-$VERSION/shellcheck" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/shellcheck" --version
      - name: Run the unit tests
        run: test/run.sh
