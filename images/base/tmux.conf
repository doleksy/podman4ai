# tmux in a Sandbox: the mouse on (click a pane, drag a border, scroll the
# history), and the status bar showing the project's name, which p4a sets
# in P4A_PROJECT.
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g status-style "bg=colour24,fg=colour255"
set -g status-left-length 40
set -g status-left "#[bold] ${P4A_PROJECT} #[nobold]| "
set -g status-right "%H:%M "
